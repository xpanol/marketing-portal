<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MARKETING DIGITAL | DIGITAL MARKETING BY XPAÑOL</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      color: #111;
      font-family: 'Special Elite', cursive;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6,
    p,
    span,
    button,
    input,
    textarea,
    div {
      font-family: 'Special Elite', cursive;
    }

    .page {
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 24px;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 24px;
      font-size: 42px;
      line-height: 1.4;
    }

    p {
      font-size: 17px;
      line-height: 1.8;
    }

    .logout-btn {
      margin-top: 28px;
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .modal {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 18px;
      padding: 34px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }

    .modal h2 {
      margin-top: 0;
      margin-bottom: 14px;
      font-size: 28px;
      line-height: 1.5;
    }

    .xpanyol {
      display: block;
      margin-top: 10px;
      font-size: 18px;
    }

    .modal p {
      margin-top: 0;
      margin-bottom: 26px;
      color: #666;
      font-size: 15px;
      line-height: 1.7;
    }

    .modal input {
      width: 100%;
      margin-bottom: 14px;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: white;
      color: #111;
      font-size: 15px;
    }

    .modal button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    .error {
      display: none;
      margin-top: 14px;
      color: #c62828;
      font-size: 14px;
    }

    #protectedContent {
      display: none;
    }

  </style>

</head>

<body>

  <div id="protectedContent" class="page">

    <h1>
      MARKETING DIGITAL | DIGITAL MARKETING
      <br>
      <span class="xpanyol">
        BY XPAÑOL
      </span>
    </h1>

    <p>
      This content is visible only to authenticated users.
    </p>

    <button
      class="logout-btn"
      onclick="logout()"
    >
      Sign out
    </button>

  </div>

  <div id="loginOverlay" class="overlay">

    <div class="modal">

      <h2>
        MARKETING DIGITAL | DIGITAL MARKETING
        <br>
        <span class="xpanyol">
          BY XPAÑOL
        </span>
      </h2>

      <p>
        Please enter your credentials to continue.
      </p>

      <input
        id="email"
        type="email"
        placeholder="Email"
        autocomplete="username"
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button id="loginBtn">
        Sign in
      </button>

      <div id="errorMessage" class="error">
        Invalid email or password.
      </div>

    </div>

  </div>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      signOut
    }
      from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";

    const firebaseConfig = {

      apiKey: "WSTAW_TU",

      authDomain: "WSTAW_TU",

      projectId: "WSTAW_TU",

      appId: "WSTAW_TU"

    };

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const overlay =
      document.getElementById("loginOverlay");

    const protectedContent =
      document.getElementById("protectedContent");

    const loginBtn =
      document.getElementById("loginBtn");

    const errorMessage =
      document.getElementById("errorMessage");

    loginBtn.onclick = async () => {

      errorMessage.style.display = "none";

      const email =
        document.getElementById("email").value;

      const password =
        document.getElementById("password").value;

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      } catch (e) {

        errorMessage.style.display = "block";

      }

    };

    onAuthStateChanged(auth, (user) => {

      if (user) {

        overlay.style.display = "none";

        protectedContent.style.display = "block";

      } else {

        overlay.style.display = "flex";

        protectedContent.style.display = "none";

      }

    });

    window.logout = async function () {

      await signOut(auth);

    };

  </script>

</body>

</html>
